spring:
  application:
    name: zhuatech-voicenote
server:
  port: ${SERVER_PORT:8080}
zhuatech:
  asr:
    provider: ${ZHUATECH_ASR_PROVIDER:local}
    base-url: ${ZHUATECH_ASR_BASE_URL:}
    model: ${ZHUATECH_ASR_MODEL:asr-provider-model}
    api-key: ${ZHUATECH_ASR_API_KEY:}
  llm:
    provider: ${ZHUATECH_LLM_PROVIDER:local}
    base-url: ${ZHUATECH_LLM_BASE_URL:https://api.deepseek.com}
    model: ${ZHUATECH_LLM_MODEL:deepseek-chat}
    api-key: ${ZHUATECH_LLM_API_KEY:}

